reqwest = "0.12.3"
mpl-token-metadata = "4.1.2"
rand = "0.8.5"
fixed = "1.12.0"
ts-rs = "8.1"
evalexpr = "11.3.0"
primitive-types = "0.12.2"
num_enum = "0.7.2"
tokio-stream = "0.1.15"
async-stream = "0.3.5"
bytemuck = { version = "1.16.1", features = ["derive", "min_const_generics"] }
rayon = "1.10.0"
crossbeam = "0.8.4"

step-ingestooor-sdk = { git = "ssh://git@github.com/step-finance/step-common-rust.git", rev = "1adbb436ec71f86a9a1fdf5b4742220d2d520a85", package = "step-ingestooor-sdk" }

