regex = "1.10.2"
spl-token-2022 = "1.0.0"
zstd = "0.13.0"
base64 = "0.21.7"
anchor-lang = "0.29.0"
thread_local = "1.1.7"
itertools = "0.12.1"
tokio-postgres = "0.7.10"
rust_decimal = { version = "1.34.3", features = ["db-tokio-postgres", "maths"] }
